# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: trivy

on:
  push:
    branches: [ "testingartifactory" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "testingartifactory" ]
  schedule:
    - cron: '23 20 * * 0'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: |
          docker build --build-arg VCS_REF=$(git rev-parse HEAD) --build-arg VERSION_TAG=0.15.0 -t docker.io/gingalang-audr/sherlock-actions-github:${{ github.sha }} .

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'docker.io/gingalang-audr/sherlock-actions-github:${{ github.sha }}'
          format: 'sarif'
          output: 'reports/sarif-sbom.json'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'reports/sarif-sbom.json'

      # Install JFrog CLI
      - name: Install JFrog CLI
        run: |
          curl -fL https://install-cli.jfrog.io | sh
          jf --version

      # Configure JFrog CLI with direct command line parameters
      - name: Configure JFrog CLI with Access Token
        run: |
          echo "Configuring JFrog CLI with server: ${{ secrets.JF_ARTIFACTORY_SERVER }}"
          jf config add --url "https://sherlockgithubactions.jfrog.io" --artifactory-url "https://sherlockgithubactions.jfrog.io/artifactory" --user "${{ secrets.JF_ARTIFACTORY_USERNAME }}" --password "${{ secrets.JF_ARTIFACT_PASSWORD }}" --interactive=false
          jf config show

      - name: Test JFrog Connection
        run: jf rt ping

      # Debug step for the upload path (doesn't expose token)
      - name: Debug Upload Path
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          echo "Will upload to: artifactory-build-info/sherlock/sarif-sbom-${TIMESTAMP}.json"

      - name: Upload to Artifactory
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          jf rt upload --url "https://sherlockgithubactions.jfrog.io/artifactory" \
            --user "${{ secrets.JF_ARTIFACTORY_USERNAME }}" \
            --password "${{ secrets.JF_ARTIFACTORY_PASSWORD }}" \
            --access-token "${{ secrets.JF_ARTIFACTORY_TOKEN }}" \
            --build-name="${{ github.repository }}" \
            --build-number="${{ github.run_number }}" \
            reports/sarif-sbom.json "artifactory-build-info/sarif-sbom-${TIMESTAMP}.json"

          echo "SBOM uploaded to Artifactory at artifactory-build-info/sarif-sbom-${TIMESTAMP}.json"

      - name: Publish Build Info
        run: |
          jf build-publish --build-name="${{ github.repository }}" --build-number="${{ github.run_number }}"


      - name: Archive SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-sbom
          path: reports/sarif-sbom.json
          retention-days: 7
