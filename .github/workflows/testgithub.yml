# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: trivy

on:
  push:
    branches: [ "testingartifactory" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "testingartifactory" ]
  schedule:
    - cron: '23 20 * * 0'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: |
          docker build --build-arg VCS_REF=$(git rev-parse HEAD) --build-arg VERSION_TAG=0.15.0 -t docker.io/gingalang-audr/sherlock-actions-github:${{ github.sha }} .


      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          image-ref: 'docker.io/gingalang-audr/sherlock-actions-github:${{ github.sha }}'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Debug Artifactory Credentials
        run: |
          echo "ARTIFACTORY_SERVER_URL: ${{ secrets.JF_ARTIFACTORY_SERVER_URL }}"
          echo "ARTIFACTORY_USERNAME: ${{ secrets.JF_ARTIFACTORY_USERNAME }}"
          echo "ARTIFACTORY_PASSWORD: ${{ secrets.JF_ARTIFACTORY_PASSWORD }}"

      - name: Run Trivy SBOM scanner
        run: |
          trivy --format cyclonedx --output reports/trivy-sbom.json docker.io/gingalang-audr/sherlock-actions-github:${{ github.sha }}

      - name: Upload SBOM to Artifactory
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: latest
        env:
          # Configure Artifactory credentials using GitHub secrets
          JF_ARTIFACTORY_SERVER: ${{ secrets.JF_ARTIFACTORY_SERVER_URL }}
          JF_ARTIFACTORY_USER: ${{ secrets.JF_ARTIFACTORY_USERNAME }}
          JF_ARTIFACTORY_PASSWORD: ${{ secrets.JF_ARTIFACTORY_PASSWORD }}

      - name: Upload to Artifactory
        run: |
          # Set the Artifactory repository path
          REPO_PATH="sbom-reports/sherlock/trivy-sbom-$(date +'%Y%m%d%H%M%S').json"

          # Upload the JSON file to Artifactory
          jf rt upload reports/trivy-sbom.json "${REPO_PATH}"

          echo "SBOM uploaded to Artifactory at ${REPO_PATH}"

      - name: Archive SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom
          path: reports/trivy-sbom.json
          retention-days: 7
