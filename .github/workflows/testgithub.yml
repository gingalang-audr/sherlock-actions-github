name: trivy

on:
  push:
    branches: [ "testingartifactory" ]
  pull_request:
    branches: [ "testingartifactory" ]
  schedule:
    - cron: '23 20 * * 0'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: |
          docker build --build-arg VCS_REF=$(git rev-parse HEAD) --build-arg VERSION_TAG=0.15.0 -t docker.io/gingalang-audr/sherlock-actions-github:${{ github.sha }} .

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'docker.io/gingalang-audr/sherlock-actions-github:${{ github.sha }}'
          format: 'sarif'
          output: 'reports/sarif-sbom.json'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'reports/sarif-sbom.json'

      # Install JFrog CLI
      - name: Install JFrog CLI
        run: |
          curl -fL https://install-cli.jfrog.io | sh
          jf --version

      # Configure JFrog CLI with direct command line parameters
      - name: Configure JFrog CLI with Access Token
        run: |
          echo "Configuring JFrog CLI with server: ${{ secrets.JF_ARTIFACTORY_SERVER }}"
          jf config add --url "https://sherlockgithubactions.jfrog.io" \
            --artifactory-url "https://sherlockgithubactions.jfrog.io/artifactory" \
            --access-token "${{ secrets.JF_ARTIFACTORY_TOKEN }}" \
            --interactive=false
          jf config show


      - name: Test JFrog Connection
        run: jf rt ping

      - name: Set Build Started Timestamp
        run: echo "BUILD_STARTED=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")" >> $GITHUB_ENV

      - name: Upload and Publish Build Info
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          BUILD_STARTED=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          echo "Using BUILD_STARTED: ${BUILD_STARTED}"

          BUILD_NAME="${{ github.repository }}"
          BUILD_NUMBER="${{ github.run_number }}"

          # Upload the artifact without build info flags to avoid matrix parameters.
          jf rt upload --url "https://sherlockgithubactions.jfrog.io/artifactory" \
            --user "${{ secrets.JF_ARTIFACTORY_USERNAME }}" \
            --access-token "${{ secrets.JF_ARTIFACTORY_TOKEN }}" \
            --password "${{ secrets.JF_ARTIFACTORY_PASSWORD }}" \
            reports/sarif-sbom.json "generic-local/sarif-sbom-${TIMESTAMP}.json"

          sleep 5  # Pause briefly to allow Artifactory to register the artifact

          # Publish the build info using positional arguments.
          jf rt build-publish "${BUILD_NAME}" "${BUILD_NUMBER}"

          echo "Artifact uploaded to generic-local and build info published."

      - name: Archive SBOM as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sarif-sbom
          path: reports/sarif-sbom.json
          retention-days: 7
